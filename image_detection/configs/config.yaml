system:
  seed: 42
  device: "cuda" # or "cpu"
  model_dir: "weights"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

model:
  backbone: "efficientnet_b4" # Options: efficientnet_b3, efficientnet_b4, convnext_tiny
  pretrained: true
  num_classes: 2
  dropout_rate: 0.4

dataset:
  train_dirs: ["data/NewsMedia", "data/Fakeddit", "data/FakeNewsNet"]
  val_split: 0.15
  test_split: 0.15
  img_size: 380 # EfficientNet-B4 default resolution
  batch_size: 8
  num_workers: 0

training:
  epochs: 50
  mixed_precision: true
  gradient_accumulation_steps: 2
  early_stopping_patience: 7
  loss_type: "focal" # Options: cross_entropy, focal
  focal_alpha: 0.25
  focal_gamma: 2.0
  optimizer:
    lr: 0.0003
    weight_decay: 0.01
  scheduler:
    t_max: 50
    eta_min: 0.000001

mlops:
  mlflow_tracking_uri: "sqlite:///mlruns/mlflow.db"
  experiment_name: "VERITASAI_ULTRA_FakeNews"